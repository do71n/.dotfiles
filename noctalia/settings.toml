[notification]
background_opacity = 0.99999997764825821
position = "bottom_right"

[plugins]
enabled = [ "dotnetrob/cat", "noctalia/bongocat" ]

[shell]
app_icon_color = "secondary"
avatar_path = "/home/dt/Pictures/wallpaper/katze-grun.jpg"
font_family = "CaskaydiaCove Nerd Font"
lang = "en"
niri_overview_type_to_launch_enabled = true

    [shell.launcher]
    categories = false
    compact = true

        [shell.launcher.providers.emoji]
        global = false
        prefix = "emo"

        [shell.launcher.providers.session]
        global = false

        [shell.launcher.providers.wallpaper]
        global = false

    [shell.panel]
    clipboard_placement = "attached"
    launcher_placement = "attached"

[theme]
builtin = "Rosé Pine"
community_palette = "Rose Pine Alt"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "ghostty", "niri" ]

[wallpaper]
directory = "/home/dt/Pictures/wallpaper"
transition = [ "disc", "fade", "honeycomb", "stripes", "wipe", "zoom" ]

    [wallpaper.default]
    path = "/home/dt/Pictures/wallpaper/katze-grun.jpg"

    [wallpaper.last]
    path = "/home/dt/Pictures/wallpaper/katze-grun.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/dt/Pictures/wallpaper/katze-grun.jpg"

[widget.active_window]
display = "icon_only"

[widget.battery]
capsule = true
capsule_fill = "on_surface_variant"

[widget.bluetooth]
capsule = true
capsule_fill = "#190B65"

[widget.brightness]
capsule = true
capsule_fill = "on_surface_variant"

[widget.cat]
cat_color = "on_surface"
cat_color_mode = "custom"
interactive = false
scale = 1.2
show_cpu_percent = true
type = "dotnetrob/cat:cat"

[widget.cat_2]
audio_spectrum = true
enable_scroll = false
input_devices = [ "/dev/input/by-path/platform-i8042-serio-0-event-kbd" ]
type = "noctalia/bongocat:cat"

[widget.clock]
capsule = true
capsule_fill = "surface"
capsule_radius = "auto"
font_weight = 700
format = "{:%b %d - %H:%M %a}"
vertical_format = " "

[widget.keyboard_layout]
capsule = true
enabled = false

[widget.launcher]
enabled = false

[widget.media]
album_art_only = true

[widget.network]
icon_color = "#08B53D"
show_label = false
show_vpn_label = true

[widget.network_rx]
capsule_padding = 0
display = "text"
glyph = "arrow-big-down-line"
interactive = false
network_speed_compact = true

[widget.network_tx]
display = "text"
glyph = "arrow-big-up-line"
interactive = false
network_speed_compact = true

[widget.power_profile]
enable_scroll = false

[widget.ram]
capsule_border = "tertiary"
capsule_radius = "auto"
interactive = false
stat = "ram_pct"

[widget.separator]
enable_scroll = false
glyph = ""
interactive = false
label = "|"
type = "custom_button"

[widget.session]
color = "error"

[widget.sysmon]
interactive = false
stat = "disk_pct"

[widget.tray]
capsule_padding = 0
detached_panel = true

[widget.volume]
capsule = true
capsule_fill = "on_surface_variant"

[widget.wallpaper]
enabled = false

[widget.weather]
show_condition = false
show_temperature = false

[widget.workspaces]
max_label_chars = 3
style = "focus_hint"