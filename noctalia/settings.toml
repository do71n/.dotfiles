config_version = 2

[bar]
order = [ "main" ]

    [bar.main]
    capsule_padding = 8.0
    center = [ "notifications", "group:g3", "clipboard" ]
    end = [ "tray", "bluetooth", "group:g1", "session" ]
    margin_edge = 6
    margin_ends = 80
    radius = 18
    start = [ "group:g6", "media", "group:g5", "group:g4" ]

        [[bar.main.capsule_group]]
        enabled = true
        fill = "surface_variant"
        id = "g2"
        members = [ "ram", "cpu" ]
        opacity = 1.0
        padding = 8.0

        [[bar.main.capsule_group]]
        border = "primary"
        enabled = true
        fill = "surface_variant"
        id = "g4"
        members = [ "network", "network_rx", "network_tx" ]
        opacity = 1.0
        padding = 8.0
        radius = 12.0

        [[bar.main.capsule_group]]
        border = ""
        enabled = true
        fill = "#431050"
        id = "g3"
        members = [ "weather", "clock", "cat_2" ]
        opacity = 1.0
        padding = 8.0

        [[bar.main.capsule_group]]
        enabled = true
        fill = "outline"
        id = "g1"
        members = [ "volume", "input_volume", "brightness", "battery" ]
        opacity = 1.0
        padding = 8.0

        [[bar.main.capsule_group]]
        border = "secondary"
        enabled = true
        fill = "surface_variant"
        id = "g5"
        members = [ "cat", "separator", "ram", "separator", "sysmon" ]
        opacity = 1.0
        padding = 8.0

        [[bar.main.capsule_group]]
        enabled = true
        fill = "surface_variant"
        id = "g6"
        members = [ "workspaces" ]
        opacity = 1.0
        padding = 8.0

